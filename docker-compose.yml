services:

  app:
    build: ./app
    container_name: guardianstack-app
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: guardianstack-nginx
    restart: unless-stopped
    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - app

  prometheus:
    image: prom/prometheus
    container_name: guardianstack-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts/alert.rules.yml:/etc/prometheus/alert.rules.yml
    depends_on:
      - app
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter
    container_name: guardianstack-node-exporter
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana
    container_name: guardianstack-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: guardianstack-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  alertmanager:
    image: prom/alertmanager
    container_name: guardianstack-alertmanager

    ports:
      - "9093:9093"

    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  webhook:
    build: ./incident-logger
    container_name: guardianstack-webhook
    ports:
      - "5001:5001"
    volumes:
      - ./incident-logger/incidents:/app/incidents
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped

volumes:
   grafana-data:
