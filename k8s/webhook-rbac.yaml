apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-diagnostics
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-diagnostics
subjects:
  - kind: ServiceAccount
    name: webhook
roleRef:
  kind: Role
  name: webhook-diagnostics
  apiGroup: rbac.authorization.k8s.io
