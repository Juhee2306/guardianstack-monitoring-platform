apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules

data:
  alert.rules.yml: |
    groups:
      - name: guardianstack-alerts
        rules:

          - alert: FlaskAppDown
            expr: up{job="flask-app"} == 0
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "Flask app is DOWN"
              description: "Flask Pod {{ $labels.pod }} is not reachable by Prometheus."

          - alert: FlaskHighErrorRate
            expr: |
              100 *
              sum(rate(flask_http_request_total{job="flask-app",status=~"5.."}[5m]))
              /
              sum(rate(flask_http_request_total{job="flask-app"}[5m]))
              > 20
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "GuardianStack Flask error rate is high"
              description: "More than 20% of Flask HTTP requests are returning 5xx responses."
