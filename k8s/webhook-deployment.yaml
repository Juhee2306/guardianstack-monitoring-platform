apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhook

spec:
  replicas: 1

  selector:
    matchLabels:
      app: webhook

  template:
    metadata:
      labels:
        app: webhook

    spec:
      containers:
      - name: webhook

        image: guardianstack-webhook:latest

        imagePullPolicy: Never

        ports:
        - containerPort: 5001
