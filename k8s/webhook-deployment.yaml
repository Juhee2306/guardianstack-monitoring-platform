apiVersion: apps/v1
kind: Deployment

metadata:
  name: webhook

spec:
  replicas: 1

  selector:
    matchLabels:
      app: webhook

  template:
    metadata:
      labels:
        app: webhook

    spec:
      serviceAccountName: webhook

      containers:
        - name: webhook
          image: guardianstack-webhook:v6
          imagePullPolicy: Never

          env:
            - name: STORAGE_BACKEND
              value: "local"

          ports:
            - containerPort: 5001
