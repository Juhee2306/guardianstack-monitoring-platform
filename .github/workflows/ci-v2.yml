name: GuardianStack CI v2

on:
  push:
    branches:
      - guardianstack-v2

  pull_request:
    branches:
      - guardianstack-v2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest -v
