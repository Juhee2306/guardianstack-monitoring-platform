name: GuardianStack CI v2

on:
  push:
    branches:
      - guardianstack-v2

  pull_request:
    branches:
      - guardianstack-v2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t guardianstack-app:ci ./app

      - name: Run container
        run: |
          docker run -d \
            --name guardian-app-ci \
            -p 5000:5000 \
            guardianstack-app:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to become healthy."
          docker logs guardian-app-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f guardian-app-ci
  kubernetes:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kubernetes cluster
        run: kind create cluster --name guardian-ci --wait 60s

      - name: Build application image
        run: docker build -t guardianstack-app:ci ./app

      - name: Load application image into kind
        run: kind load docker-image guardianstack-app:ci --name guardian-ci

      - name: Prepare CI image tag
        run: |
          sed 's#guardianstack-app:v6#guardianstack-app:ci#' \
            k8s/flask-deployment.yaml > /tmp/flask-deployment.yaml

      - name: Validate Kubernetes manifests
        run: |
          kubectl apply --dry-run=server \
            -f k8s/app-configmap.yaml \
            -f /tmp/flask-deployment.yaml \
            -f k8s/flask-service.yaml \
            -f k8s/nginx-configmap.yaml \
            -f k8s/nginx-deployment.yaml \
            -f k8s/nginx-service.yaml

      - name: Deploy GuardianStack
        run: |
          kubectl apply -f k8s/app-configmap.yaml
          kubectl apply -f /tmp/flask-deployment.yaml
          kubectl apply -f k8s/flask-service.yaml
          kubectl apply -f k8s/nginx-configmap.yaml
          kubectl apply -f k8s/nginx-deployment.yaml
          kubectl apply -f k8s/nginx-service.yaml

      - name: Wait for Flask rollout
        run: kubectl rollout status deployment/flask-app --timeout=120s

      - name: Wait for NGINX rollout
        run: kubectl rollout status deployment/nginx --timeout=120s

      - name: Show cluster state
        run: |
          kubectl get pods
          kubectl get services
          kubectl get endpointslice

      - name: Test application through NGINX
        run: |
          kubectl port-forward service/nginx-service 8080:80 > /tmp/port-forward.log 2>&1 &
          sleep 3
          curl --fail http://localhost:8080/health

      - name: Cleanup
        if: always()
        run: kind delete cluster --name guardian-ci
