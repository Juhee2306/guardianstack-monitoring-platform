name: GuardianStack CI v2

on:
  push:
    branches:
      - guardianstack-v2

  pull_request:
    branches:
      - guardianstack-v2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t guardianstack-app:ci ./app

      - name: Run container
        run: |
          docker run -d \
            --name guardian-app-ci \
            -p 5000:5000 \
            guardianstack-app:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Application is healthy."
              exit 0
            fi
            sleep 1
          done

          echo "Application failed to become healthy."
          docker logs guardian-app-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f guardian-app-ci
